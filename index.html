<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Chat App - v1</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; background: #111b21; color: #e9edef; }
    .box { max-width: 480px; margin: 20px auto; background: #202c33; padding: 20px; border-radius: 12px; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; font-size: 15px; }
    input { background: #2a3942; color: #fff; }
    button { background: #00a884; color: #111b21; font-weight: bold; cursor: pointer; }
    button.secondary { background: #374045; color: #fff; }
    #chatScreen { display: none; max-width: 600px; margin: 0 auto; height: 100vh; flex-direction: column; background: #0b141a; }
    .header { background: #202c33; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 78%; padding: 10px 12px; border-radius: 10px; background: #202c33; word-wrap: break-word; }
    .msg.me { align-self: flex-end; background: #005c4b; }
    .meta { font-size: 11px; opacity: 0.75; margin-top: 4px; text-align: right; }
    .sender { font-size: 11px; color: #53bdeb; font-weight: bold; margin-bottom: 3px; }
    .footer { background: #202c33; padding: 10px; display: flex; gap: 8px; }
    .footer input { margin: 0; flex: 1; }
    .footer button { width: auto; margin: 0; padding: 0 18px; }
    .status-bar { font-size: 12px; color: #8696a0; padding: 4px 16px; background: #111b21; }
  </style>
</head>
<body>

  <!-- Login / Register Screen -->
  <div class="box" id="authScreen">
    <h2>Chat App - Login / Sign Up</h2>
    <p style="font-size: 13px; color: #aebac1;">Email සහ Password එකක් දීලා Account එකක් හදාගන්න හෝ Log වෙන්න.</p>
    <input type="text" id="nameInput" placeholder="ඔයාගේ නම (උදා: Ashan)" />
    <input type="email" id="emailInput" placeholder="Email address" />
    <input type="password" id="passInput" placeholder="Password (අඩුම අකුරු 6ක්)" />
    <button id="signupBtn">Sign Up (අලුත් Account එකක්)</button>
    <button id="loginBtn" class="secondary">Login (දැනටමත් තියෙන Account එකෙන්)</button>
    <p id="authStatus" style="color: #ff6b6b; font-size: 13px;"></p>
  </div>

  <!-- Chat Screen -->
  <div id="chatScreen">
    <div class="header">
      <div>
        <div id="myTitle" style="font-weight: bold;">Global Chat Room</div>
        <div id="onlineInfo" style="font-size: 12px; color: #00a884;">Connected</div>
      </div>
      <button id="logoutBtn" class="secondary" style="width: auto; padding: 8px 12px; font-size: 13px;">Logout</button>
    </div>
    <div class="status-bar" id="typingIndicator"></div>
    <div class="messages" id="messagesList"></div>
    <div class="footer">
      <input type="text" id="msgInput" placeholder="මැසේජ් එකක් ලියන්න..." />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
      onAuthStateChanged, signOut, updateProfile
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getDatabase, ref, push, onChildAdded, onValue, set
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBPVxkpgjH0lU8p2lITGPa6qBdDqYDxOas",
      authDomain: "my-whatsapp-clone-5d734.firebaseapp.com",
      projectId: "my-whatsapp-clone-5d734",
      storageBucket: "my-whatsapp-clone-5d734.firebasestorage.app",
      messagingSenderId: "517004696512",
      appId: "1:517004696512:web:8e8fd640564c0b89890625",
      measurementId: "G-J5REPCD2GN"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const authScreen = document.getElementById("authScreen");
    const chatScreen = document.getElementById("chatScreen");
    const authStatus = document.getElementById("authStatus");
    const messagesList = document.getElementById("messagesList");
    const msgInput = document.getElementById("msgInput");
    const typingIndicator = document.getElementById("typingIndicator");

    let currentUser = null;
    let initialLoaded = false;

    // Request browser/webview notification permission when possible
    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission().catch(() => {});
    }

    document.getElementById("signupBtn").addEventListener("click", async () => {
      const name = document.getElementById("nameInput").value.trim() || "User";
      const email = document.getElementById("emailInput").value.trim();
      const pass = document.getElementById("passInput").value;
      authStatus.textContent = "";
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(cred.user, { displayName: name });
      } catch (e) {
        authStatus.textContent = e.message;
      }
    });

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("emailInput").value.trim();
      const pass = document.getElementById("passInput").value;
      authStatus.textContent = "";
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (e) {
        authStatus.textContent = e.message;
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      location.reload();
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        authScreen.style.display = "none";
        chatScreen.style.display = "flex";
        document.getElementById("myTitle").textContent = "Chat (" + (user.displayName || user.email) + ")";
        startChatListeners();
      } else {
        currentUser = null;
        authScreen.style.display = "block";
        chatScreen.style.display = "none";
      }
    });

    function startChatListeners() {
      const msgsRef = ref(db, "messages");
      messagesList.innerHTML = "";
      initialLoaded = false;

      // Mark initial existing messages loaded after a short delay
      setTimeout(() => { initialLoaded = true; }, 1200);

      onChildAdded(msgsRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        const isMe = data.uid === currentUser.uid;
        const div = document.createElement("div");
        div.className = "msg" + (isMe ? " me" : "");

        const timeStr = new Date(data.time || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        div.innerHTML = `
          ${!isMe ? `<div class="sender">${escapeHtml(data.sender || "User")}</div>` : ""}
          <div>${escapeHtml(data.text || "")}</div>
          <div class="meta">${timeStr}</div>
        `;
        messagesList.appendChild(div);
        messagesList.scrollTop = messagesList.scrollHeight;

        // Show notification for new incoming messages
        if (!isMe && initialLoaded) {
          showAlertNotification(data.sender || "New Message", data.text || "");
        }
      });

      const typingRef = ref(db, "typing");
      onValue(typingRef, (snap) => {
        const val = snap.val() || {};
        const others = Object.entries(val)
          .filter(([uid, t]) => uid !== currentUser.uid && t && (Date.now() - t < 3000))
          .map(([uid]) => uid);
        typingIndicator.textContent = others.length ? "කවුරුහරි මැසේජ් එකක් ලියනවා..." : "";
      });
    }

    function showAlertNotification(title, body) {
      if ("Notification" in window && Notification.permission === "granted") {
        try {
          new Notification(title, { body });
        } catch (_) {}
      }
    }

    msgInput.addEventListener("input", () => {
      if (!currentUser) return;
      set(ref(db, "typing/" + currentUser.uid), Date.now());
    });

    async function sendMessage() {
      const text = msgInput.value.trim();
      if (!text || !currentUser) return;
      msgInput.value = "";
      await push(ref(db, "messages"), {
        uid: currentUser.uid,
        sender: currentUser.displayName || currentUser.email,
        text,
        time: Date.now()
      });
    }

    document.getElementById("sendBtn").addEventListener("click", sendMessage);
    msgInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }
  </script>
</body>
</html>
